services:
  - type: web
    name: anopticon-site
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    domains:
      - anopticon.com
      - www.anopticon.com
    routes:
      - type: redirect
        source: /ais-spoofing/
        destination: /questions/
      - type: redirect
        source: /team.html
        destination: /team/
      - type: redirect
        source: /research.html
        destination: /research/
      - type: redirect
        source: /about.html
        destination: /about/
      - type: redirect
        source: /contact.html
        destination: /contact/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
